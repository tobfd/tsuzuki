name: Release

# Push a tag like v1.2.3: builds the signed release APK and attaches it to a GitHub release with
# generated release notes. versionName = 1.2.3, versionCode = 1 * 10000 + 2 * 100 + 3.
# Secrets (docs/RELEASING.md): ANILIST_CLIENT_ID, RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD,
# RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD.
on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Signed APK and GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # Matches the Gradle daemon JVM in gradle/gradle-daemon-jvm.properties.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Version from the tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^([0-9]+)\.([0-9]{1,2})\.([0-9]{1,2})$ ]]; then
            echo "::error::The tag must look like v1.2.3 (minor and patch below 100), got $GITHUB_REF_NAME"
            exit 1
          fi
          code=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Version $version ($code)"

      - name: Client ID and keystore from secrets
        env:
          ANILIST_CLIENT_ID: ${{ secrets.ANILIST_CLIENT_ID }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANILIST_CLIENT_ID" ] || [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::Secrets missing: ANILIST_CLIENT_ID and RELEASE_KEYSTORE_BASE64 (see docs/RELEASING.md)"
            exit 1
          fi
          echo "anilist.clientId=$ANILIST_CLIENT_ID" > local.properties
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      # No configuration cache: the signing passwords must not end up in a cache entry.
      - name: Build the signed release APK
        env:
          TSUZUKI_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          TSUZUKI_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          TSUZUKI_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          TSUZUKI_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: >
          ./gradlew :app:assembleRelease --no-configuration-cache
          -Ptsuzuki.versionName=${{ steps.version.outputs.name }}
          -Ptsuzuki.versionCode=${{ steps.version.outputs.code }}

      - name: Check the signature
        run: |
          apk="tsuzuki-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/apksigner"
          "$apksigner" verify --print-certs "$apk"

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" local.properties

      - name: GitHub release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" "tsuzuki-${GITHUB_REF_NAME}.apk"
          --title "Tsuzuki ${GITHUB_REF_NAME}"
          --generate-notes
          --verify-tag
