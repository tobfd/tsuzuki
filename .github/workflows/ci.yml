name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Spotless + build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # Matches the Gradle daemon JVM in gradle/gradle-daemon-jvm.properties.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      # The real client ID stays out of CI; any valid value is enough to build and test.
      - name: Write local.properties with a dummy AniList client ID
        run: echo "anilist.clientId=0" > local.properties

      - name: Spotless check and build
        run: ./gradlew spotlessCheck build

      # Glance finds a widget's instances by its class name. If R8 merges or renames the widget
      # classes, one widget's updates redraw the others with its content (issue #18).
      - name: Check that R8 kept the widget classes apart
        run: |
          mapping=app/build/outputs/mapping/release/mapping.txt
          for widget in inprogress.InProgressWidget nextepisode.NextEpisodeWidget friends.FriendActivityWidget; do
            class="com.tobfd.tsuzuki.feature.widgets.$widget"
            grep -qxF "$class -> $class:" "$mapping" || { echo "::error::R8 merged or renamed $class"; exit 1; }
          done

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: '**/build/reports/'
          retention-days: 7
