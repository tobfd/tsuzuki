name: Feature request
description: Suggest an idea or an improvement.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Tsuzuki aims to be useful every day without being overloaded. Some things are planned for after v1 already (see "Roadmap" in the README), so please have a look there first.
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The problem or the situation, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How it could work in the app.
    validations:
      required: true
  - type: textarea
    id: anilist
    attributes:
      label: AniList support
      description: Optional. Does anilist.co offer this already? Link the page or the API field if you know it.
